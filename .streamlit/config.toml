# Runtime config. Local dev picks this up automatically; the Docker image
# also sets the key server flags via env vars.

[server]
headless = true
address = "0.0.0.0"
# Hugging Face Spaces (and most PaaS) run the app behind a reverse proxy;
# these two avoid websocket / iframe issues.
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4f83cc"
backgroundColor = "#131a2b"
secondaryBackgroundColor = "#1c2536"
textColor = "#f4f6fb"

[runner]
fastReruns = true
