name: Refresh dashboard data

# Automated data + model + simulation refresh.
#   * every 6 hours in-season (the cron below)
#   * add a second schedule at */15 during game windows if desired
#   * manual trigger via the Actions tab
on:
  schedule:
    - cron: "0 */6 * * *"        # every 6 hours, UTC
    # Game-day cadence (Fri-Sun): uncomment to refresh every 15 minutes.
    # - cron: "*/15 * * * 5,6,0"
  workflow_dispatch:

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system OpenMP (LightGBM/XGBoost)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore data/model cache
        uses: actions/cache@v4
        with:
          path: |
            data/processed
            models
          key: cfb-artifacts-${{ github.run_id }}
          restore-keys: cfb-artifacts-

      - name: Run full update
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/update_dashboard.py --iterations 10000

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-artifacts
          path: |
            data/processed/**
            models/**
          retention-days: 7

      # Optional: commit refreshed artifacts back to the repo so a hosted
      # Streamlit deployment picks them up. Requires contents: write.
      # - name: Commit artifacts
      #   run: |
      #     git config user.name  "cfb-refresh-bot"
      #     git config user.email "cfb-refresh-bot@users.noreply.github.com"
      #     git add data/processed models
      #     git commit -m "chore: automated data refresh" || echo "no changes"
      #     git push
